name: freshmeat-ai

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      FRESHMEAT_DB_PATH: /data/freshmeat.db
    volumes:
      - api-data:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  api-data:
