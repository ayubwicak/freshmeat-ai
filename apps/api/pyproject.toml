[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freshmeat-api"
version = "1.0.0"
description = "FreshMeat AI FastAPI delivery service."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "python-multipart>=0.0.9",
    "freshmeat-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx2>=0.1",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
